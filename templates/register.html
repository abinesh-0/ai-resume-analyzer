<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | AI Resume Analyzer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #263b80 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #542d82 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #070b18,
                    #10162a 50%,
                    #080b16
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background:
                rgba(76, 132, 255, 0.08);

            filter: blur(80px);

            top: -180px;
            right: -120px;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                rgba(162, 78, 255, 0.07);

            filter: blur(80px);

            bottom: -150px;
            left: -120px;

            pointer-events: none;
        }

        .page {
            width: 100%;
            max-width: 450px;

            position: relative;

            z-index: 2;
        }

        .register-card {
            width: 100%;

            padding: 28px 30px 26px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.105),
                    rgba(255,255,255,0.045)
                );

            border: 1px solid
                rgba(255,255,255,0.13);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.45),
                inset 0 1px 0
                rgba(255,255,255,0.08);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            animation:
                cardEnter 0.65s ease;
        }

        @keyframes cardEnter {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .brand {
            text-align: center;

            margin-bottom: 22px;
        }

        .brand-icon {
            width: 54px;
            height: 54px;

            margin: 0 auto 12px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            background:
                linear-gradient(
                    135deg,
                    #5b7cff,
                    #8c52ff
                );

            box-shadow:
                0 10px 30px
                rgba(92, 104, 255, 0.3);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 750;

            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 6px;

            color: #9da7bd;

            font-size: 13px;
        }

        .flash-area {
            margin-bottom: 15px;
        }

        .flash {
            padding: 11px 13px;

            border-radius: 11px;

            font-size: 12px;

            border: 1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color: #dce4f7;
        }

        .flash.error {
            border-color:
                rgba(255, 88, 110, 0.3);

            background:
                rgba(255, 88, 110, 0.08);

            color: #ffb8c2;
        }

        .flash.success {
            border-color:
                rgba(76, 220, 150, 0.3);

            background:
                rgba(76, 220, 150, 0.08);

            color: #a7f3ca;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            color: #c5cce0;

            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #75809a;

            font-size: 15px;

            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;

            height: 45px;

            padding:
                0 13px 0 40px;

            border-radius: 11px;

            border: 1px solid
                rgba(255,255,255,0.10);

            outline: none;

            color: #ffffff;

            background:
                rgba(7,11,25,0.55);

            font-size: 13px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .input-wrap input::placeholder {
            color: #626c83;
        }

        .input-wrap input:focus {
            border-color:
                rgba(105,132,255,0.75);

            background:
                rgba(7,11,25,0.72);

            box-shadow:
                0 0 0 3px
                rgba(88,112,255,0.10);
        }

        .email-status {
            min-height: 16px;

            margin-top: 5px;

            font-size: 11px;
        }

        .email-status.valid {
            color: #73e5ad;
        }

        .email-status.invalid {
            color: #ff9ba9;
        }

        .otp-section {
            margin-top: 7px;

            padding: 16px;

            border-radius: 15px;

            background:
                rgba(93,116,255,0.075);

            border: 1px solid
                rgba(110,132,255,0.18);

            display: none;

            animation:
                otpEnter 0.35s ease;
        }

        .otp-section.show {
            display: block;
        }

        @keyframes otpEnter {

            from {
                opacity: 0;
                transform:
                    translateY(-8px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        .otp-title {
            font-size: 13px;

            font-weight: 700;

            margin-bottom: 4px;
        }

        .otp-description {
            font-size: 11px;

            color: #8994ad;

            margin-bottom: 11px;

            line-height: 1.5;
        }

        .otp-input {
            width: 100%;

            height: 45px;

            border-radius: 11px;

            border: 1px solid
                rgba(255,255,255,0.11);

            background:
                rgba(5,9,20,0.65);

            color: #ffffff;

            outline: none;

            text-align: center;

            letter-spacing: 7px;

            font-size: 18px;

            font-weight: 700;

            padding-left: 7px;
        }

        .otp-input:focus {
            border-color:
                rgba(110,132,255,0.8);

            box-shadow:
                0 0 0 3px
                rgba(88,112,255,0.10);
        }

        .otp-bottom {
            margin-top: 7px;

            display: flex;

            justify-content: flex-end;

            align-items: center;
        }

        .countdown {
            font-size: 10px;

            color: #8994ad;

            text-align: right;
        }

        .countdown strong {
            color: #c8d1e8;
        }

        .resend-btn {
            display: none;

            border: none;

            background: transparent;

            color: #8197ff;

            cursor: pointer;

            font-size: 11px;

            font-weight: 700;

            padding: 0;
        }

        .resend-btn:hover {
            color: #a9b8ff;
            text-decoration: underline;
        }

        .resend-btn.show {
            display: inline-block;
        }

        .verify-btn {
            width: 100%;

            height: 43px;

            margin-top: 12px;

            border: none;

            border-radius: 10px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #5c78ff,
                    #824fff
                );

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 9px 25px
                rgba(87,101,255,0.23);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        .verify-btn:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 12px 30px
                rgba(87,101,255,0.32);
        }

        .verify-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
        }

        .send-btn {
            width: 100%;

            height: 45px;

            margin-top: 2px;

            border: none;

            border-radius: 11px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #5c78ff,
                    #824fff
                );

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 9px 25px
                rgba(87,101,255,0.23);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        .send-btn:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 12px 30px
                rgba(87,101,255,0.32);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            width: 15px;
            height: 15px;

            border: 2px solid
                rgba(255,255,255,0.35);

            border-top-color:
                #ffffff;

            border-radius: 50%;

            display: inline-block;

            vertical-align: middle;

            margin-right: 7px;

            animation:
                spin 0.75s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .login-link {
            text-align: center;

            margin-top: 19px;

            color: #7f899f;

            font-size: 11px;
        }

        .login-link a {
            color: #91a4ff;

            text-decoration: none;

            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 6px;

            margin-top: 13px;

            color: #657088;

            font-size: 10px;
        }

        .success-message {
            margin-top: 9px;

            color: #78e6ad;

            font-size: 11px;

            text-align: center;

            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .register-card {
                padding:
                    24px 20px 22px;

                border-radius: 20px;
            }

            .brand h1 {
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="register-card">

        <!-- BRAND -->
        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Start your AI-powered career journey
            </p>

        </div>


        <!-- REGISTER FORM -->
        <form
            id="registerForm"
            method="POST"
            action="{{ url_for('register') }}"
            autocomplete="off"
        >

            <!-- NAME -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        value="{{ pending_name or '' }}"
                        required
                        minlength="2"
                    >

                </div>

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Gmail Address
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        value="{{ pending_email or '' }}"
                        required
                    >

                </div>

                <div
                    id="emailStatus"
                    class="email-status"
                ></div>

            </div>


            <!-- SEND OTP -->
            <button
                type="submit"
                id="sendOtpBtn"
                class="send-btn"
            >
                <span id="sendBtnText">
                    Send OTP
                </span>

                <span
                    id="sendLoader"
                    class="loader hidden"
                ></span>
            </button>

        </form>


        <!-- OTP SECTION -->
        <div
            id="otpSection"
            class="otp-section {% if otp_sent %}show{% endif %}"
        >

            <div class="otp-title">
                Verify your email
            </div>

            <div class="otp-description">
                Enter the 6-digit OTP sent to
                <strong id="otpEmail">
                    {{ pending_email or '' }}
                </strong>
            </div>

            <input
                type="text"
                id="otpInput"
                class="otp-input"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="••••••"
            >

            <div class="otp-bottom">

                <span
                    id="countdown"
                    class="countdown"
                >
                    Expires in
                    <strong id="timer">
                        {% if otp_sent %}1:30{% else %}1:30{% endif %}
                    </strong>
                </span>

                <button
                    type="button"
                    id="resendBtn"
                    class="resend-btn"
                >
                    Resend OTP
                </button>

            </div>

            <button
                type="button"
                id="verifyBtn"
                class="verify-btn"
            >
                Verify OTP
            </button>

            <div
                id="otpMessage"
                class="success-message"
            ></div>

        </div>


        <!-- LOGIN -->
        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>


        <!-- SECURITY -->
        <div class="security-note">

            <span>🔒</span>

            <span>
                Your account information is protected
            </span>

        </div>

    </div>

</div>


    <!-- SERVER OTP STATE -->
    <input type="hidden" id="serverOtpSent" value="{{ '1' if otp_sent else '0' }}">
    <input type="hidden" id="serverOtpRemaining" value="{{ otp_remaining or 0 }}">
    <input type="hidden" id="serverEmail" value="{{ pending_email or '' }}">

<script>

    // =====================================================
    // ELEMENTS
    // =====================================================

    const registerForm =
        document.getElementById(
            "registerForm"
        );

    const nameInput =
        document.getElementById(
            "name"
        );

    const emailInput =
        document.getElementById(
            "email"
        );

    const emailStatus =
        document.getElementById(
            "emailStatus"
        );

    const sendOtpBtn =
        document.getElementById(
            "sendOtpBtn"
        );

    const sendBtnText =
        document.getElementById(
            "sendBtnText"
        );

    const sendLoader =
        document.getElementById(
            "sendLoader"
        );

    const otpSection =
        document.getElementById(
            "otpSection"
        );

    const otpEmail =
        document.getElementById(
            "otpEmail"
        );

    const otpInput =
        document.getElementById(
            "otpInput"
        );

    const verifyBtn =
        document.getElementById(
            "verifyBtn"
        );

    const resendBtn =
        document.getElementById(
            "resendBtn"
        );

    const countdown =
        document.getElementById(
            "countdown"
        );

    const timer =
        document.getElementById(
            "timer"
        );

    const otpMessage =
        document.getElementById(
            "otpMessage"
        );


    // =====================================================
    // GMAIL VALIDATION
    // =====================================================

    const gmailPattern =
        /^[A-Za-z0-9._%+-]+@gmail\.com$/i;


    function isValidGmail() {

        return gmailPattern.test(
            emailInput.value.trim()
        );

    }


    function updateEmailValidation() {

        const email =
            emailInput.value.trim();

        if (!email) {

            emailStatus.textContent = "";

            sendOtpBtn.disabled = true;

            return false;
        }


        if (gmailPattern.test(email)) {

            emailStatus.textContent =
                "✓ Valid Gmail address";

            emailStatus.className =
                "email-status valid";

            sendOtpBtn.disabled = false;

            return true;

        }


        emailStatus.textContent =
            "Enter a valid Gmail address";

        emailStatus.className =
            "email-status invalid";

        sendOtpBtn.disabled = true;

        return false;
    }


    emailInput.addEventListener(
        "input",
        updateEmailValidation
    );


    emailInput.addEventListener(
        "blur",
        updateEmailValidation
    );


    // =====================================================
    // ENTER KEY NAVIGATION
    // =====================================================

    // Full Name -> Email
    nameInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                event.preventDefault();
                emailInput.focus();
            }
        }
    );


    // Email -> Send OTP
    emailInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                event.preventDefault();

                if (isValidGmail() && nameInput.value.trim()) {
                    registerForm.requestSubmit(sendOtpBtn);
                } else {
                    updateEmailValidation();
                }
            }
        }
    );


    // =====================================================
    // INITIAL EMAIL STATE
    // =====================================================

    updateEmailValidation();


    // =====================================================
    // SEND OTP
    // =====================================================

    registerForm.addEventListener(
        "submit",
        function(event) {

            if (!nameInput.value.trim()) {

                event.preventDefault();

                nameInput.focus();

                return;
            }


            if (!isValidGmail()) {

                event.preventDefault();

                emailInput.focus();

                updateEmailValidation();

                return;
            }


            sendOtpBtn.disabled = true;

            sendBtnText.textContent =
                "Sending...";

            sendLoader.classList.remove(
                "hidden"
            );

        }
    );


    // =====================================================
    // COUNTDOWN VARIABLES
    // =====================================================

    let countdownInterval = null;


    function formatTime(seconds) {

        seconds = Math.max(
            0,
            Math.floor(seconds)
        );

        const minutes =
            Math.floor(
                seconds / 60
            );

        const remainingSeconds =
            seconds % 60;

        return (
            String(minutes)
            +
            ":"
            +
            String(
                remainingSeconds
            ).padStart(
                2,
                "0"
            )
        );
    }


    function stopCountdown() {

        if (countdownInterval) {

            clearInterval(
                countdownInterval
            );

            countdownInterval = null;
        }
    }


    function startCountdown(
        seconds
    ) {

        stopCountdown();

        const safeSeconds = Math.max(
            0,
            Math.floor(Number(seconds) || 0)
        );

        const deadline =
            Date.now() + (safeSeconds * 1000);

        resendBtn.classList.remove(
            "show"
        );

        countdown.style.display =
            "inline";

        function update() {

            const remaining = Math.max(
                0,
                Math.ceil(
                    (deadline - Date.now()) / 1000
                )
            );

            timer.textContent =
                formatTime(remaining);

            verifyBtn.disabled =
                remaining <= 0;

            if (remaining <= 0) {
                countdown.style.display =
                    "none";

                resendBtn.classList.add(
                    "show"
                );

                stopCountdown();
            }
        }

        update();

        if (safeSeconds > 0) {
            countdownInterval =
                setInterval(update, 250);
        }
    }


    // =====================================================
    // SHOW OTP SECTION
    // =====================================================

    function showOtpSection(
        email,
        seconds
    ) {

        otpSection.classList.add(
            "show"
        );

        otpEmail.textContent =
            email;

        otpInput.value = "";

        otpMessage.textContent = "";

        otpMessage.classList.remove(
            "show"
        );

        startCountdown(
            seconds
        );

        setTimeout(
            function() {

                otpInput.focus();

            },
            150
        );
    }


    // =====================================================
    // EXISTING SERVER OTP
    // =====================================================

    const serverOtpSent =
        document.getElementById("serverOtpSent").value === "1";

    const serverOtpRemaining =
        parseInt(
            document.getElementById("serverOtpRemaining").value || "0",
            10
        );

    const serverEmail =
        document.getElementById("serverEmail").value;
    if (
        serverOtpSent
        &&
        serverOtpRemaining > 0
    ) {

        showOtpSection(
            serverEmail,
            serverOtpRemaining
        );

    } else {

        otpSection.classList.remove(
            "show"
        );
    }


    // =====================================================
    // OTP ONLY NUMBERS
    // =====================================================

    otpInput.addEventListener(
        "input",
        function() {

            this.value =
                this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    6
                );

        }
    );


    // =====================================================
    // OTP ENTER KEY -> VERIFY OTP
    // =====================================================

    otpInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                event.preventDefault();

                if (!verifyBtn.disabled) {
                    verifyBtn.click();
                }
            }
        }
    );


    // =====================================================
    // VERIFY OTP
    // =====================================================

    verifyBtn.addEventListener(
        "click",
        async function() {

            const otp =
                otpInput.value.trim();

            if (!/^\d{6}$/.test(otp)) {

                showOtpError(
                    "Please enter the 6-digit OTP."
                );

                otpInput.focus();

                return;
            }


            verifyBtn.disabled = true;

            verifyBtn.innerHTML =
                '<span class="loader"></span> Verifying...';


            try {

                const formData =
                    new FormData();

                formData.append(
                    "otp",
                    otp
                );


                const response =
                    await fetch(
                        "{{ url_for('register_verify_otp') }}",
                        {
                            method: "POST",
                            body: formData,
                            headers: {
                                "X-Requested-With":
                                    "XMLHttpRequest"
                            }
                        }
                    );


                const data =
                    await response.json();


                if (
                    response.ok
                    &&
                    data.success
                ) {

                    stopCountdown();

                    verifyBtn.innerHTML =
                        "✓ Email Verified";

                    verifyBtn.disabled =
                        true;

                    otpMessage.textContent =
                        "OTP verified. Redirecting...";

                    otpMessage.classList.add(
                        "show"
                    );

                    setTimeout(
                        function() {

                            window.location.href =
                                "{{ url_for('create_password') }}";

                        },
                        500
                    );

                    return;
                }


                showOtpError(
                    data.message ||
                    "Invalid OTP."
                );

                verifyBtn.disabled =
                    false;

                verifyBtn.textContent =
                    "Verify OTP";

            } catch (error) {

                showOtpError(
                    "Unable to verify OTP. Please try again."
                );

                verifyBtn.disabled =
                    false;

                verifyBtn.textContent =
                    "Verify OTP";
            }

        }
    );


    // =====================================================
    // OTP ERROR
    // =====================================================

    function showOtpError(
        message
    ) {

        otpMessage.textContent =
            message;

        otpMessage.style.color =
            "#ff9ba9";

        otpMessage.classList.add(
            "show"
        );

    }


    // =====================================================
    // RESEND OTP
    // =====================================================

    resendBtn.addEventListener(
        "click",
        async function() {

            resendBtn.disabled =
                true;

            resendBtn.textContent =
                "Sending...";


            try {

                const formData =
                    new FormData();

                formData.append(
                    "purpose",
                    "register"
                );


                const response =
                    await fetch(
                        "{{ url_for('resend_otp') }}",
                        {
                            method: "POST",
                            body: formData,
                            headers: {
                                "X-Requested-With":
                                    "XMLHttpRequest"
                            }
                        }
                    );


                const data =
                    await response.json();


                if (
                    response.ok
                    &&
                    data.success
                ) {

                    otpInput.value = "";
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = "Verify OTP";

                    otpMessage.textContent =
                        "New OTP sent successfully.";

                    otpMessage.style.color =
                        "#78e6ad";

                    otpMessage.classList.add(
                        "show"
                    );


                    // New OTP is valid for 90 seconds
                    startCountdown(90);

                    // Make sure Verify OTP is enabled
                    verifyBtn.disabled = false;


                    resendBtn.disabled =
                        false;

                    resendBtn.textContent =
                        "Resend OTP";

                    otpInput.focus();

                    return;
                }


                showOtpError(
                    data.message ||
                    "Unable to resend OTP."
                );


                resendBtn.disabled =
                    false;

                resendBtn.textContent =
                    "Resend OTP";

            } catch (error) {

                showOtpError(
                    "Unable to resend OTP. Please try again."
                );

                resendBtn.disabled =
                    false;

                resendBtn.textContent =
                    "Resend OTP";
            }

        }
    );


</script>

</body>
</html>
