<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Password | AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        /* =====================================================
           MAIN BACKGROUND
        ===================================================== */

        .create-password-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(56, 189, 248, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(168, 85, 247, 0.20),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 85%,
                    rgba(236, 72, 153, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 85%,
                    rgba(34, 197, 94, 0.13),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #070b1a,
                    #0d1228 45%,
                    #11152e
                );
        }


        /* =====================================================
           ANIMATED BACKGROUND BLOBS
        ===================================================== */

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            pointer-events: none;
            opacity: 0.45;
            animation: floatOrb 9s ease-in-out infinite;
        }

        .orb-one {
            width: 230px;
            height: 230px;

            top: -80px;
            left: -70px;

            background:
                radial-gradient(
                    circle,
                    rgba(56, 189, 248, 0.65),
                    transparent 68%
                );

            animation-delay: 0s;
        }

        .orb-two {
            width: 280px;
            height: 280px;

            right: -100px;
            top: 15%;

            background:
                radial-gradient(
                    circle,
                    rgba(168, 85, 247, 0.60),
                    transparent 68%
                );

            animation-delay: 2s;
        }

        .orb-three {
            width: 210px;
            height: 210px;

            bottom: -80px;
            left: 12%;

            background:
                radial-gradient(
                    circle,
                    rgba(34, 197, 94, 0.45),
                    transparent 68%
                );

            animation-delay: 4s;
        }

        .orb-four {
            width: 180px;
            height: 180px;

            bottom: 8%;
            right: 10%;

            background:
                radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.45),
                    transparent 68%
                );

            animation-delay: 6s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(0, -25px, 0)
                    scale(1.08);
            }
        }


        /* =====================================================
           SMALL PARTICLES
        ===================================================== */

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.55);

            animation: particleMove 7s linear infinite;
        }

        .particle:nth-child(1) {
            left: 12%;
            top: 25%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 28%;
            top: 75%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(3) {
            left: 72%;
            top: 25%;
            animation-delay: 3s;
        }

        .particle:nth-child(4) {
            left: 88%;
            top: 70%;
            animation-delay: 4s;
        }

        .particle:nth-child(5) {
            left: 52%;
            top: 12%;
            animation-delay: 2s;
        }

        @keyframes particleMove {

            0% {
                transform:
                    translateY(20px);
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            70% {
                opacity: 0.7;
            }

            100% {
                transform:
                    translateY(-70px);
                opacity: 0;
            }
        }


        /* =====================================================
           CARD
        ===================================================== */

        .password-card {
            width: min(390px, 100%);

            position: relative;
            z-index: 5;

            padding: 30px 30px 28px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31, 41, 72, 0.88),
                    rgba(14, 20, 43, 0.91)
                );

            border: 1px solid
                rgba(148, 163, 184, 0.20);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.48),
                0 0 45px rgba(99, 102, 241, 0.08);

            animation:
                cardAppear 0.75s
                cubic-bezier(.22, 1, .36, 1);
        }

        .password-card::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: 24px;

            padding: 1px;

            background:
                linear-gradient(
                    135deg,
                    rgba(56, 189, 248, 0.65),
                    rgba(168, 85, 247, 0.45),
                    rgba(236, 72, 153, 0.35),
                    rgba(34, 197, 94, 0.35)
                );

           mask: linear-gradient(#fff 0 0) padding-box,
      linear-gradient(#fff 0 0);

-webkit-mask: linear-gradient(#fff 0 0) padding-box,
              linear-gradient(#fff 0 0);

-webkit-mask-composite: xor;
mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           VERIFIED BADGE
        ===================================================== */

        .verified-badge {
            width: fit-content;

            display: flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 15px;
            padding: 7px 11px;

            border-radius: 999px;

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;

            color: #86efac;

            background:
                rgba(34, 197, 94, 0.09);

            border: 1px solid
                rgba(74, 222, 128, 0.22);

            box-shadow:
                0 0 18px
                rgba(34, 197, 94, 0.08);

            animation:
                badgeGlow 2.5s
                ease-in-out infinite;
        }

        .verified-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #4ade80;

            box-shadow:
                0 0 10px #4ade80;
        }

        @keyframes badgeGlow {

            0%,
            100% {
                box-shadow:
                    0 0 12px
                    rgba(34, 197, 94, 0.08);
            }

            50% {
                box-shadow:
                    0 0 24px
                    rgba(34, 197, 94, 0.18);
            }
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .password-card h1 {
            font-size: 27px;
            line-height: 1.15;

            color: #f8fafc;

            letter-spacing: -0.7px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;

            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 23px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .password-form {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .field {
            margin-bottom: 17px;
        }

        .field-label {
            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 12px;
            font-weight: 700;
        }


        /* =====================================================
           INPUT WRAPPER
        ===================================================== */

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 17px;
            height: 17px;

            color: #64748b;

            pointer-events: none;

            transition:
                color 0.25s ease;
        }

        .password-input {
            width: 100%;
            height: 46px;

            padding:
                0 44px
                0 42px;

            border-radius: 12px;

            outline: none;

            color: #f8fafc;

            font-size: 13px;
            font-weight: 500;

            background:
                rgba(7, 12, 29, 0.68);

            border: 1px solid
                rgba(148, 163, 184, 0.16);

            box-shadow:
                inset 0 1px 0
                rgba(255, 255, 255, 0.025);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        .password-input::placeholder {
            color: #475569;
        }

        .password-input:focus {
            background:
                rgba(10, 17, 37, 0.88);

            border-color:
                rgba(56, 189, 248, 0.60);

            box-shadow:
                0 0 0 3px
                rgba(56, 189, 248, 0.08),
                0 0 25px
                rgba(56, 189, 248, 0.08);
        }

        .input-wrapper:focus-within .input-icon {
            color: #38bdf8;
        }


        /* =====================================================
           SHOW PASSWORD
        ===================================================== */

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            background: transparent;

            color: #64748b;

            cursor: pointer;

            border-radius: 7px;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .toggle-password:hover {
            color: #7dd3fc;

            background:
                rgba(56, 189, 248, 0.08);
        }


        /* =====================================================
           PASSWORD STRENGTH
        ===================================================== */

        .strength {
            margin-top: 8px;

            opacity: 0;

            transform:
                translateY(-3px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .strength.show {
            opacity: 1;

            transform:
                translateY(0);
        }

        .strength-bars {
            display: flex;
            gap: 4px;

            margin-bottom: 5px;
        }

        .strength-bar {
            height: 3px;
            flex: 1;

            border-radius: 99px;

            background:
                rgba(100, 116, 139, 0.20);

            transition:
                background 0.25s ease;
        }

        .strength-text {
            font-size: 10px;
            color: #64748b;
        }


        /* =====================================================
           CONFIRM ERROR / SUCCESS
        ===================================================== */

        .field-message {
            min-height: 16px;

            margin-top: 6px;

            font-size: 10px;
            font-weight: 600;

            opacity: 0;

            transform:
                translateY(-3px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .field-message.show {
            opacity: 1;

            transform:
                translateY(0);
        }

        .field-message.error {
            color: #fb7185;
        }

        .field-message.success {
            color: #4ade80;
        }

        .password-input.error-input {
            border-color:
                rgba(248, 113, 113, 0.75);

            box-shadow:
                0 0 0 3px
                rgba(248, 113, 113, 0.07);
        }

        .password-input.success-input {
            border-color:
                rgba(74, 222, 128, 0.55);

            box-shadow:
                0 0 0 3px
                rgba(74, 222, 128, 0.06);
        }


        /* =====================================================
           SHAKE ANIMATION
        ===================================================== */

        .shake {
            animation:
                shakeInput 0.38s
                cubic-bezier(.36, .07, .19, .97);
        }

        @keyframes shakeInput {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }


        /* =====================================================
           CREATE ACCOUNT BUTTON
        ===================================================== */

        .create-btn {
            width: 100%;
            height: 46px;

            margin-top: 4px;

            border: 0;
            border-radius: 12px;

            color: white;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 0.1px;

            cursor: pointer;

            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    110deg,
                    #38bdf8,
                    #6366f1 38%,
                    #8b5cf6 68%,
                    #ec4899
                );

            background-size: 200% 100%;

            box-shadow:
                0 12px 30px
                rgba(99, 102, 241, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.25s ease,
                background-position 0.5s ease;
        }

        .create-btn:hover {
            transform:
                translateY(-2px);

            background-position:
                100% 50%;

            box-shadow:
                0 16px 36px
                rgba(99, 102, 241, 0.34),
                0 0 25px
                rgba(56, 189, 248, 0.10);
        }

        .create-btn:active {
            transform:
                translateY(0)
                scale(0.98);
        }

        .create-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.20),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left 0.7s ease;
        }

        .create-btn:hover::before {
            left: 140%;
        }


        /* =====================================================
           SECURITY FOOTER
        ===================================================== */

        .security {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            margin-top: 18px;

            color: #64748b;

            font-size: 10px;
        }

        .security-icon {
            color: #4ade80;
            font-size: 12px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .create-password-page {
                padding: 16px;
            }

            .password-card {
                padding: 25px 21px 23px;

                border-radius: 20px;
            }

            .password-card h1 {
                font-size: 24px;
            }

            .orb-one {
                width: 170px;
                height: 170px;
            }

            .orb-two {
                width: 200px;
                height: 200px;
            }
        }

    </style>
</head>


<body>

    <main class="create-password-page">

        <!-- Animated background -->
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
        <div class="orb orb-four"></div>

        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>


        <!-- =================================================
             PASSWORD CARD
        ================================================== -->

        <section class="password-card">

            <div class="verified-badge">
                <span class="verified-dot"></span>
                EMAIL VERIFIED ✓
            </div>


            <h1>Create password</h1>

            <p class="subtitle">
                Choose a strong password to secure your
                AI Resume Analyzer account.
            </p>


            <!-- =================================================
                 BACKEND FORM — NAMES UNCHANGED
            ================================================== -->

            <form
                method="post"
                class="password-form"
                id="passwordForm"
            >


                <!-- PASSWORD -->

                <div class="field">

                    <label
                        class="field-label"
                        for="password"
                    >
                        Password
                    </label>

                    <div class="input-wrapper">

                        <!-- Lock icon -->
                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>
                        </svg>


                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="password-input"
                            minlength="8"
                            required
                            autocomplete="new-password"
                            placeholder="Enter your password"
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Show password"
                        >
                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M2 12s3.5-7 10-7
                                       10 7 10 7-3.5 7-10 7
                                       -10-7-10-7Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>
                            </svg>
                        </button>

                    </div>


                    <!-- Strength -->

                    <div
                        class="strength"
                        id="strengthBox"
                    >

                        <div class="strength-bars">

                            <span
                                class="strength-bar"
                                id="bar1"
                            ></span>

                            <span
                                class="strength-bar"
                                id="bar2"
                            ></span>

                            <span
                                class="strength-bar"
                                id="bar3"
                            ></span>

                            <span
                                class="strength-bar"
                                id="bar4"
                            ></span>

                        </div>

                        <span
                            class="strength-text"
                            id="strengthText"
                        >
                            Password strength
                        </span>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="field">

                    <label
                        class="field-label"
                        for="confirmPassword"
                    >
                        Confirm password
                    </label>

                    <div class="input-wrapper">

                        <!-- Lock icon -->
                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>
                        </svg>


                        <input
                            type="password"
                            name="confirm_password"
                            id="confirmPassword"
                            class="password-input"
                            minlength="8"
                            required
                            autocomplete="new-password"
                            placeholder="Re-enter your password"
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M2 12s3.5-7 10-7
                                       10 7 10 7-3.5 7-10 7
                                       -10-7-10-7Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>
                            </svg>
                        </button>

                    </div>


                    <!--
                        IMPORTANT:
                        Error appears BELOW confirm password
                    -->

                    <div
                        id="confirmMessage"
                        class="field-message"
                    ></div>

                </div>



                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="create-btn"
                    id="createBtn"
                >
                    Create account
                </button>

            </form>


            <!-- Security -->

            <div class="security">

                <span class="security-icon">
                    🔒
                </span>

                <span>
                    Your account information is securely protected
                </span>

            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const confirmMessage =
            document.getElementById("confirmMessage");

        const form =
            document.getElementById("passwordForm");

        const strengthBox =
            document.getElementById("strengthBox");

        const strengthText =
            document.getElementById("strengthText");


        const bars = [
            document.getElementById("bar1"),
            document.getElementById("bar2"),
            document.getElementById("bar3"),
            document.getElementById("bar4")
        ];


        /* =====================================================
           SHOW / HIDE PASSWORD
        ===================================================== */

        document
            .querySelectorAll(".toggle-password")
            .forEach(function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const targetId =
                            this.dataset.target;

                        const input =
                            document.getElementById(
                                targetId
                            );

                        if (
                            input.type === "password"
                        ) {

                            input.type = "text";

                            this.setAttribute(
                                "aria-label",
                                "Hide password"
                            );

                            this.style.color =
                                "#38bdf8";

                        } else {

                            input.type = "password";

                            this.setAttribute(
                                "aria-label",
                                "Show password"
                            );

                            this.style.color =
                                "";
                        }

                    }
                );

            });



        /* =====================================================
           PASSWORD STRENGTH
        ===================================================== */

        function checkPasswordStrength(value) {

            if (!value) {

                strengthBox.classList.remove(
                    "show"
                );

                bars.forEach(function(bar) {
                    bar.style.background =
                        "rgba(100,116,139,0.20)";
                });

                return;
            }


            strengthBox.classList.add(
                "show"
            );


            let score = 0;


            if (value.length >= 8) {
                score++;
            }

            if (/[A-Z]/.test(value)) {
                score++;
            }

            if (/[0-9]/.test(value)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                score++;
            }


            bars.forEach(function(bar, index) {

                if (index < score) {

                    if (score === 1) {
                        bar.style.background =
                            "#fb7185";
                    }

                    else if (score === 2) {
                        bar.style.background =
                            "#facc15";
                    }

                    else if (score === 3) {
                        bar.style.background =
                            "#38bdf8";
                    }

                    else {
                        bar.style.background =
                            "#4ade80";
                    }

                } else {

                    bar.style.background =
                        "rgba(100,116,139,0.20)";
                }

            });


            if (score === 1) {

                strengthText.textContent =
                    "Weak password";

                strengthText.style.color =
                    "#fb7185";

            }

            else if (score === 2) {

                strengthText.textContent =
                    "Fair password";

                strengthText.style.color =
                    "#facc15";

            }

            else if (score === 3) {

                strengthText.textContent =
                    "Good password";

                strengthText.style.color =
                    "#38bdf8";

            }

            else {

                strengthText.textContent =
                    "Strong password";

                strengthText.style.color =
                    "#4ade80";
            }

        }


        password.addEventListener(
            "input",
            function() {

                checkPasswordStrength(
                    this.value
                );

                checkPasswords();

            }
        );



        /* =====================================================
           CONFIRM PASSWORD CHECK
        ===================================================== */

        function checkPasswords() {

            const pass =
                password.value;

            const confirm =
                confirmPassword.value;


            /*
             * Nothing entered
             */

            if (!confirm) {

                confirmMessage.textContent =
                    "";

                confirmMessage.className =
                    "field-message";

                confirmPassword.classList.remove(
                    "error-input",
                    "success-input"
                );

                return true;
            }


            /*
             * Passwords match
             */

            if (
                pass === confirm
                &&
                pass.length >= 8
            ) {

                confirmMessage.textContent =
                    "✓ Passwords match";

                confirmMessage.className =
                    "field-message success show";

                confirmPassword.classList.remove(
                    "error-input"
                );

                confirmPassword.classList.add(
                    "success-input"
                );

                return true;
            }


            /*
             * Passwords DON'T match
             */

            confirmMessage.textContent =
                "✕ Passwords do not match";

            confirmMessage.className =
                "field-message error show";

            confirmPassword.classList.remove(
                "success-input"
            );

            confirmPassword.classList.add(
                "error-input"
            );

            return false;
        }


        confirmPassword.addEventListener(
            "input",
            function() {

                checkPasswords();

            }
        );



        /* =====================================================
           SHAKE WHEN CONFIRM PASSWORD IS WRONG
        ===================================================== */

        confirmPassword.addEventListener(
            "blur",
            function() {

                if (
                    this.value
                    &&
                    this.value !== password.value
                ) {

                    this.classList.remove(
                        "shake"
                    );

                    /*
                     * Force browser reflow so the
                     * animation can run again.
                     */

                    void this.offsetWidth;

                    this.classList.add(
                        "shake"
                    );

                }

            }
        );



        /* =====================================================
           FORM SUBMIT VALIDATION
        ===================================================== */

        form.addEventListener(
            "submit",
            function(event) {

                const pass =
                    password.value;

                const confirm =
                    confirmPassword.value;


                if (
                    pass !== confirm
                ) {

                    event.preventDefault();

                    confirmMessage.textContent =
                        "✕ Passwords do not match";

                    confirmMessage.className =
                        "field-message error show";

                    confirmPassword.classList.remove(
                        "shake"
                    );

                    void confirmPassword.offsetWidth;

                    confirmPassword.classList.add(
                        "shake"
                    );

                    confirmPassword.focus();

                    return;
                }


                if (
                    pass.length < 8
                ) {

                    event.preventDefault();

                    password.focus();

                    return;
                }

            }
        );

    </script>

</body>

</html>
