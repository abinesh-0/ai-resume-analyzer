<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | AI Resume Analyzer</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 15% 15%,#263b80 0,transparent 34%),radial-gradient(circle at 85% 85%,#542d82 0,transparent 34%),linear-gradient(135deg,#070b18,#10162a 50%,#080b16)}.card{width:min(390px,calc(100% - 20px));padding:30px 28px 26px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px);animation:enter .55s ease}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}.icon{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#5b7cff,#7b4dff)}.eyebrow{text-align:center;color:#7ddcff;font-size:10px;font-weight:800;letter-spacing:2px;margin-bottom:8px}.card h1{text-align:center;font-size:25px;margin-bottom:8px}.muted{text-align:center;color:rgba(222,232,246,.68);font-size:12px;line-height:1.55;margin-bottom:20px}.form{display:flex;flex-direction:column;gap:9px}.field label{display:block;font-size:11px;color:rgba(230,238,248,.72);margin:0 0 6px}.wrap{position:relative}.wrap input{width:100%;height:44px;padding:0 43px 0 13px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(4,8,18,.38);color:#fff;outline:none;transition:.2s}.wrap input:focus{border-color:rgba(93,220,255,.7);box-shadow:0 0 0 3px rgba(93,220,255,.08),0 0 22px rgba(93,220,255,.12)}.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:rgba(190,220,235,.55);cursor:pointer}.eye:hover{color:#5ddcff;background:rgba(93,220,255,.08)}.btn{width:100%;height:44px;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:6px;color:#06101b;background:linear-gradient(110deg,#61ddff,#8d7bff,#61ddff);background-size:200% 100%;animation:g 4s linear infinite}@keyframes g{to{background-position:200% 0}}.error{color:#ff7885;font-size:10.5px;text-align:center;min-height:16px;margin-top:2px}.flash{color:#ff7885;font-size:10.5px;text-align:center;margin-bottom:9px}.back{text-align:center;margin-top:17px;font-size:11px}.back a{color:#8fe6ff;text-decoration:none}</style></head><body><section class="card"><div class="icon">🔐</div><p class="eyebrow">PASSWORD RESET</p><h1>Create new password</h1><p class="muted">Your email has been verified. Set a new password for your account.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}{% if category=='error' %}<div class="flash">{{ msg }}</div>{% endif %}{% endfor %}{% endwith %}<form method="post" class="form" id="resetForm"><div class="field"><label>New Password</label><div class="wrap"><input type="password" id="password" name="password" minlength="8" placeholder="Enter new password" required><button type="button" class="eye" data-target="password">◉</button></div></div><div class="field"><label>Confirm Password</label><div class="wrap"><input type="password" id="confirmPassword" name="confirm_password" minlength="8" placeholder="Confirm new password" required><button type="button" class="eye" data-target="confirmPassword">◉</button></div></div><div class="error" id="clientError"></div><button class="btn" type="submit">Change Password</button></form><p class="back"><a href="{{ url_for('login') }}">Back to login</a></p></section><script>document.querySelectorAll('.eye').forEach(btn=>btn.addEventListener('click',()=>{const i=document.getElementById(btn.dataset.target);i.type=i.type==='password'?'text':'password';i.focus() }));document.getElementById('resetForm').addEventListener('submit',e=>{const p=document.getElementById('password').value,c=document.getElementById('confirmPassword').value,err=document.getElementById('clientError');err.textContent='';if(p.length<8){e.preventDefault();err.textContent='Password must be at least 8 characters.';return}if(p!==c){e.preventDefault();err.textContent='Passwords do not match.'}});</script></body></html>
